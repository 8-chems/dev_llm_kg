steps:
  # 1. Lint & Static Analysis
  - name: 'python:3.12-slim'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        pip install uv
        uv sync --extra dev
        uv run ruff check src/ tests/ eval/
        uv run mypy src/

  # 2. Run Unit & Integration Tests
  - name: 'python:3.12-slim'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        pip install uv
        uv sync --extra dev
        uv run pytest tests/unit tests/integration

  # 3. Container Build & Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west9-docker.pkg.dev/$PROJECT_ID/app/jev-graphrag:$COMMIT_SHA'
      - '-t'
      - 'europe-west9-docker.pkg.dev/$PROJECT_ID/app/jev-graphrag:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west9-docker.pkg.dev/$PROJECT_ID/app/jev-graphrag:$COMMIT_SHA'

  # 4. Terraform Staging Deploy
  - name: 'hashicorp/terraform:1.5.0'
    dir: 'infra/terraform'
    args:
      - 'init'

  - name: 'hashicorp/terraform:1.5.0'
    dir: 'infra/terraform'
    args:
      - 'apply'
      - '-auto-approve'
      - '-var-file=envs/dev.tfvars'
      - '-var=image=europe-west9-docker.pkg.dev/$PROJECT_ID/app/jev-graphrag:$COMMIT_SHA'

images:
  - 'europe-west9-docker.pkg.dev/$PROJECT_ID/app/jev-graphrag:$COMMIT_SHA'
  - 'europe-west9-docker.pkg.dev/$PROJECT_ID/app/jev-graphrag:latest'
